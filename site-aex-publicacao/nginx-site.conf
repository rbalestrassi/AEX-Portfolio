server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: nunca cachear — browser sempre busca versão nova
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Imagens de produto: cache de 1 dia
    location /assets/produtos/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Outros assets estáticos (CSS, JS, fontes, ícones): cache de 7 dias
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
