<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — AEX Air Automotive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 400px; padding: 16px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo img { height: 48px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--aex-dark); border-radius: var(--radius); padding: 4px; }
    .tabs button { flex: 1; padding: 8px; background: transparent; color: var(--aex-muted); border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: .2s; }
    .tabs button.active { background: var(--aex-card); color: var(--aex-text); }
    .panel { display: none; }
    .panel.active { display: block; }
    .divider { text-align: center; margin: 20px 0; color: var(--aex-muted); font-size: 13px; }
    a.link { color: var(--aex-red); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <img src="/assets/aex-logo.png" alt="AEX Air Automotive" onerror="this.style.display='none'">
      <p style="font-size:22px;font-weight:700;margin-top:8px">AEX Air Automotive</p>
      <p class="text-muted" style="margin-top:4px">Plataforma de Pedidos B2B</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tab-cliente" class="active" onclick="switchTab('cliente')">Cliente</button>
        <button id="tab-admin" onclick="switchTab('admin')">Admin</button>
      </div>

      <!-- Login Cliente -->
      <div id="panel-cliente" class="panel active">
        <form id="form-login">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com.br" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" id="btn-login">Entrar</button>
        </form>
        <div class="divider">Não tem conta?</div>
        <a href="/cadastro" class="btn btn-secondary" style="width:100%;justify-content:center">Cadastre-se</a>
      </div>

      <!-- Login Admin -->
      <div id="panel-admin" class="panel">
        <form id="form-admin">
          <div class="form-group">
            <label>Email Admin</label>
            <input type="email" id="admin-email" placeholder="admin@aex.com.br" required>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="admin-senha" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" id="btn-admin">Entrar como Admin</button>
        </form>
      </div>
    </div>
  </div>

  <div id="aex-toast"></div>

  <script>
    const params  = new URLSearchParams(location.search);
    const redirect = params.get('next') || '/';

    function switchTab(t) {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + t).classList.add('active');
      document.getElementById('panel-' + t).classList.add('active');
    }

    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 3500);
    }

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error, true); btn.disabled = false; btn.textContent = 'Entrar'; return; }
        if (d.cliente.status === 'pendente') {
          toast('Cadastro pendente de aprovação. Aguarde.', true);
          btn.disabled = false; btn.textContent = 'Entrar'; return;
        }
        location.href = redirect;
      } catch { toast('Erro de conexão.', true); btn.disabled = false; btn.textContent = 'Entrar'; }
    });

    document.getElementById('form-admin').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-admin');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('admin-email').value,
            senha: document.getElementById('admin-senha').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error, true); btn.disabled = false; btn.textContent = 'Entrar como Admin'; return; }
        location.href = '/admin';
      } catch { toast('Erro de conexão.', true); btn.disabled = false; btn.textContent = 'Entrar como Admin'; }
    });

    // Redirecionar se já logado
    fetch('/api/auth/me').then(r => r.ok && r.json()).then(d => {
      if (!d) return;
      location.href = d.tipo === 'admin' ? '/admin' : redirect;
    });
  </script>
</body>
</html>
