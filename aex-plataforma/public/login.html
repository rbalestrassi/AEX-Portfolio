<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — AEX Air Automotive</title>
  <script>(function(){var t=localStorage.getItem('aex-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 400px; padding: 16px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo img { height: 48px; }
    .theme-corner { position:fixed; top:16px; right:16px; }
    .forgot-link { display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--aex-muted); cursor:pointer; }
    .forgot-link:hover { color:var(--aex-text); }
    .forgot-panel { display:none; margin-top:16px; padding:16px; background:var(--aex-bg); border:1px solid var(--aex-border); border-radius:var(--radius); font-size:13px; }
    .forgot-panel.open { display:block; }
  </style>
</head>
<body>
  <button class="theme-toggle theme-corner" onclick="toggleTheme()" title="Alternar tema"></button>
  <div class="login-box">
    <div class="login-logo">
      <img src="/assets/aex-logo.png" alt="AEX Air Automotive" onerror="this.style.display='none'">
      <p style="font-size:22px;font-weight:700;margin-top:8px">AEX Air Automotive</p>
      <p class="text-muted" style="margin-top:4px">Área do Cliente</p>
    </div>

    <div class="card">
      <form id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="seu@email.com.br" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="btn-login">Entrar</button>
      </form>
    </div>

    <span class="forgot-link" onclick="toggleForgot()">Esqueceu sua senha?</span>
    <div class="forgot-panel" id="forgot-panel">
      <p style="margin:0 0 8px">Para recuperar o acesso, entre em contato com a AEX:</p>
      <p style="margin:0"><strong>📱 WhatsApp:</strong> <a href="https://wa.me/5511999999999" target="_blank" rel="noopener">(11) 99999-9999</a></p>
      <p style="margin:6px 0 0"><strong>📧 Email:</strong> <a href="mailto:contato@aexautomotive.com.br">contato@aexautomotive.com.br</a></p>
    </div>
  </div>

  <div id="aex-toast"></div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('aex-theme', next);
    }

    function toggleForgot() {
      document.getElementById('forgot-panel').classList.toggle('open');
    }

    const params   = new URLSearchParams(location.search);
    const redirect = params.get('next') || '/';

    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 3500);
    }

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error, true); btn.disabled = false; btn.textContent = 'Entrar'; return; }
        if (d.cliente.status === 'bloqueado') {
          toast('Acesso bloqueado. Entre em contato com a AEX.', true);
          btn.disabled = false; btn.textContent = 'Entrar'; return;
        }
        location.href = redirect;
      } catch { toast('Erro de conexão.', true); btn.disabled = false; btn.textContent = 'Entrar'; }
    });

    fetch('/api/auth/me').then(r => r.ok && r.json()).then(d => {
      if (!d) return;
      if (d.tipo === 'admin') { location.href = '/admin'; return; }
      location.href = redirect;
    });
  </script>
</body>
</html>
