<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — AEX Air Automotive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 0; }
    .cad-box { width: 100%; max-width: 480px; padding: 16px; }
    .cad-logo { text-align: center; margin-bottom: 24px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width:480px){ .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="cad-box">
    <div class="cad-logo">
      <img src="/assets/aex-logo.png" alt="AEX" height="40" onerror="this.style.display='none'">
      <p style="font-size:20px;font-weight:700;margin-top:8px">Criar conta</p>
      <p class="text-muted" style="margin-top:4px">Plataforma de Pedidos B2B — AEX Air Automotive</p>
    </div>

    <div class="card">
      <form id="form-cad">
        <div class="form-group">
          <label>CNPJ *</label>
          <input type="text" id="cnpj" placeholder="00.000.000/0001-00" required maxlength="18">
        </div>
        <div class="form-group">
          <label>Razão Social *</label>
          <input type="text" id="razao" placeholder="Empresa Ltda" required>
        </div>
        <div class="form-group">
          <label>Nome Fantasia</label>
          <input type="text" id="fantasia" placeholder="Opcional">
        </div>
        <div class="form-group">
          <label>Responsável pelo pedido *</label>
          <input type="text" id="responsavel" placeholder="Nome completo" required>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>WhatsApp *</label>
            <input type="tel" id="whatsapp" placeholder="55 11 99999-9999" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>Senha * (min. 6 chars)</label>
            <input type="password" id="senha" placeholder="••••••••" required minlength="6">
          </div>
          <div class="form-group">
            <label>Confirmar senha *</label>
            <input type="password" id="senha2" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="btn-cad">
          Criar conta
        </button>
        <p class="text-muted" style="margin-top:12px;text-align:center;font-size:13px">
          Após o cadastro, a AEX irá aprovar seu acesso para pedidos.
        </p>
      </form>
    </div>

    <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--aex-muted)">
      Já tem conta? <a href="/login" style="color:var(--aex-red)">Entrar</a>
    </p>
  </div>

  <div id="aex-toast"></div>

  <script>
    // Máscara CNPJ
    document.getElementById('cnpj').addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 14);
      if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
      else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})/, '$1.$2.$3/$4');
      else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{3})/, '$1.$2.$3');
      else if (v.length > 2) v = v.replace(/^(\d{2})(\d{3})/, '$1.$2');
      e.target.value = v;
    });

    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 4000);
    }

    document.getElementById('form-cad').addEventListener('submit', async e => {
      e.preventDefault();
      if (document.getElementById('senha').value !== document.getElementById('senha2').value) {
        return toast('As senhas não coincidem.', true);
      }
      const btn = document.getElementById('btn-cad');
      btn.disabled = true; btn.textContent = 'Cadastrando...';

      try {
        const r = await fetch('/api/auth/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cnpj:         document.getElementById('cnpj').value,
            razao_social: document.getElementById('razao').value,
            nome_fantasia: document.getElementById('fantasia').value,
            responsavel:  document.getElementById('responsavel').value,
            whatsapp:     document.getElementById('whatsapp').value,
            email:        document.getElementById('email').value,
            senha:        document.getElementById('senha').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error, true); btn.disabled = false; btn.textContent = 'Criar conta'; return; }
        toast('✅ ' + d.message);
        setTimeout(() => location.href = '/login', 3000);
      } catch { toast('Erro de conexão. Tente novamente.', true); btn.disabled = false; btn.textContent = 'Criar conta'; }
    });
  </script>
</body>
</html>
