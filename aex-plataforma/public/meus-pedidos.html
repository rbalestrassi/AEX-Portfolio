<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus Pedidos — AEX Air Automotive</title>
  <script>(function(){var t=localStorage.getItem('aex-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    /* ── Filtros de status ── */
    .status-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px; }
    .status-tab { white-space:nowrap; padding:6px 14px; border-radius:20px; border:1px solid var(--aex-border); background:transparent; color:var(--aex-muted); cursor:pointer; font-size:13px; font-weight:500; transition:.2s; }
    .status-tab:hover { color:var(--aex-text); border-color:#555; }
    .status-tab.active { background:var(--aex-red); color:#111; border-color:var(--aex-red); font-weight:700; }

    /* ── Resumo geral ── */
    .summary-strip { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:20px; padding:14px 16px; background:var(--aex-card); border:1px solid var(--aex-border); border-radius:var(--radius); }
    .summary-strip .s-item strong { display:block; font-size:20px; font-weight:800; color:var(--aex-success); }
    .summary-strip .s-item span   { font-size:12px; color:var(--aex-muted); }

    /* ── Card de pedido ── */
    .pedido-card { margin-bottom:16px; }
    .pedido-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .pedido-numero { font-size:16px; font-weight:700; }
    .pedido-data   { font-size:12px; color:var(--aex-muted); margin-top:2px; }
    .pedido-valor  { font-size:18px; font-weight:800; color:var(--aex-success); }

    /* ── Itens do pedido ── */
    .itens-list { margin-top:12px; }
    .item-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--aex-border); font-size:13px; }
    .item-row img { width:40px; height:40px; object-fit:cover; border-radius:6px; background:#222; flex-shrink:0; }
    .item-info { flex:1; min-width:0; }
    .item-info strong { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-info span { font-size:12px; color:var(--aex-muted); }
    .item-preco { text-align:right; white-space:nowrap; flex-shrink:0; }
    .item-preco .val { font-weight:600; color:var(--aex-success); font-size:13px; }
    .item-preco .qty { font-size:12px; color:var(--aex-muted); }

    /* ── Footer do card ── */
    .pedido-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--aex-border); }
    .pedido-obs { font-size:13px; color:var(--aex-muted); flex:1; }
    .toggle-btn { background:none; border:none; color:var(--aex-red); cursor:pointer; font-size:13px; font-weight:600; padding:0; }

    /* ── Botão repetir no card ── */
    .btn-repetir-order { font-size:12px; padding:6px 14px; }

    /* ── FAB novo pedido ── */
    .btn-novo { position:fixed; bottom:24px; right:24px; border-radius:50px; padding:14px 24px; box-shadow:0 4px 16px rgba(200,16,46,.4); z-index:100; }

    .empty-msg { text-align:center; padding:64px; color:var(--aex-muted); }

    /* overrides light */
    [data-theme="light"] .btn-novo { color:#f5f4f4; box-shadow:0 4px 16px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <nav class="aex-nav">
    <img src="/assets/aex-logo.png" class="logo" alt="AEX" onerror="this.style.display='none'">
    <div class="aex-nav-links">
      <a href="/">Catálogo</a>
      <a href="/meus-pedidos" class="active">Meus Pedidos</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema"></button>
    </div>
  </nav>

  <div class="container">
    <div class="flex items-center justify-between mb-6">
      <h1 class="page-title" style="margin:0">Meus Pedidos</h1>
      <span id="user-name" style="font-size:13px;color:var(--aex-muted)"></span>
    </div>

    <div id="loading" style="text-align:center;padding:48px;color:var(--aex-muted)">Carregando pedidos...</div>

    <div id="content" hidden>
      <!-- Resumo geral -->
      <div class="summary-strip">
        <div class="s-item"><strong id="s-total">0</strong><span>pedidos</span></div>
        <div class="s-item"><strong id="s-valor">—</strong><span>valor total</span></div>
        <div class="s-item"><strong id="s-unidades">0</strong><span>unidades</span></div>
      </div>

      <!-- Filtros por status -->
      <div class="status-tabs">
        <button class="status-tab active" data-status="todos" onclick="setStatusFilter('todos')">Todos</button>
        <button class="status-tab" data-status="recebido"  onclick="setStatusFilter('recebido')">Recebido</button>
        <button class="status-tab" data-status="separando" onclick="setStatusFilter('separando')">Separando</button>
        <button class="status-tab" data-status="enviado"   onclick="setStatusFilter('enviado')">Enviado</button>
        <button class="status-tab" data-status="entregue"  onclick="setStatusFilter('entregue')">Entregue</button>
      </div>

      <div id="pedidos-list"></div>
      <div id="empty-filter" class="empty-msg" hidden>
        <p style="font-size:32px">🔍</p>
        <p style="margin-top:8px">Nenhum pedido com esse status.</p>
      </div>
    </div>

    <div id="empty-all" class="empty-msg" hidden>
      <p style="font-size:40px">📋</p>
      <p style="margin-top:12px">Nenhum pedido ainda.</p>
      <a href="/" class="btn btn-primary" style="margin-top:16px">Fazer primeiro pedido</a>
    </div>
  </div>

  <a href="/" class="btn btn-primary btn-novo">🛒 Novo Pedido</a>
  <div id="aex-toast"></div>

  <script>
    let allPedidos = [];
    let activeStatus = 'todos';
    let cart = (() => { try { return JSON.parse(localStorage.getItem('aex_cart') || '[]'); } catch { return []; } })();

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('aex-theme', next);
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmtBRL(v) {
      return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
    }
    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 4000);
    }
    async function logout() {
      await fetch('/api/auth/logout', { method:'POST' });
      location.href = '/login';
    }

    const STEPS = ['recebido','separando','enviado','entregue'];
    const STEP_LABELS = { recebido:'Recebido', separando:'Separando', enviado:'Enviado', entregue:'Entregue' };

    function progressBar(status) {
      const cur = STEPS.indexOf(status);
      return `<div class="progress-bar">` +
        STEPS.map((s, i) => `
          <div class="progress-step ${i < cur ? 'done' : i === cur ? 'active' : ''}">
            <div class="step-dot">${i < cur ? '✓' : i + 1}</div>
            <div class="step-label">${STEP_LABELS[s]}</div>
          </div>`).join('') +
      `</div>`;
    }

    function repetirPedido(pid) {
      const pedido = allPedidos.find(p => p.id === pid);
      if (!pedido) return;
      const itens = parseItens(pedido.itens);
      let added = 0;
      itens.forEach(item => {
        if (!cart.some(c => c.codigo === item.codigo)) {
          cart.push({
            codigo:         item.codigo,
            nome:           item.nome || '',
            linha:          item.linha || '',
            quantidade:     item.quantidade || 1,
            imagem:         item.imagem || '',
            preco_original: item.preco_original || null,
            preco_final:    item.preco_unitario || null,
            ipi:            item.ipi || null,
            desconto:       pedido.desconto_aplicado || 0,
          });
          added++;
        }
      });
      if (added > 0) {
        localStorage.setItem('aex_cart', JSON.stringify(cart));
        toast(`✅ ${added} ${added === 1 ? 'item adicionado' : 'itens adicionados'} ao carrinho!`);
      } else {
        toast('Todos os itens já estão no carrinho.');
      }
    }

    function parseItens(raw) {
      try { return typeof raw === 'string' ? JSON.parse(raw) : (raw || []); } catch { return []; }
    }

    function renderPedido(p, idx) {
      const itens    = parseItens(p.itens);
      const data     = new Date(p.criado_em).toLocaleDateString('pt-BR');
      const hora     = new Date(p.criado_em).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      const totalPcs = itens.reduce((s, i) => s + (i.quantidade || 1), 0);
      const totalVal = itens.reduce((s, i) => s + ((i.preco_unitario || 0) * (i.quantidade || 1)), 0);
      const temPreco = itens.some(i => i.preco_unitario);
      const uid      = 'p' + p.id;
      // Primeiro pedido começa expandido
      const expanded = idx === 0;

      return `
        <div class="card pedido-card">
          <div class="pedido-header">
            <div>
              <div class="pedido-numero">📦 ${esc(p.numero)}</div>
              <div class="pedido-data">${esc(data)} às ${esc(hora)} · ${itens.length} modelo(s) · ${totalPcs} unidade(s)</div>
            </div>
            <div style="text-align:right">
              <span class="badge badge-${esc(p.status)}">${esc(STEP_LABELS[p.status] || p.status)}</span>
              ${temPreco ? `<div class="pedido-valor" style="margin-top:4px">${fmtBRL(totalVal)}</div>` : ''}
            </div>
          </div>

          ${progressBar(p.status)}

          <div class="itens-list" id="${uid}-itens" ${expanded ? '' : 'hidden'}>
            ${itens.map(i => {
              const qty = i.quantidade || 1;
              const sub = i.preco_unitario ? i.preco_unitario * qty : null;
              return `
              <div class="item-row">
                <img src="${esc(i.imagem || '')}" alt="${esc(i.nome)}" onerror="this.style.display='none'">
                <div class="item-info">
                  <strong>${esc(i.codigo)} — ${esc(i.nome)}</strong>
                  <span>${esc(i.linha || '')}</span>
                </div>
                <div class="item-preco">
                  <div class="qty">${qty}x</div>
                  ${sub ? `<div class="val">${fmtBRL(sub)}</div>` : ''}
                </div>
              </div>`;
            }).join('')}
          </div>

          <div class="pedido-footer">
            <div>
              <button class="toggle-btn" onclick="toggleItens('${uid}')">
                <span id="${uid}-toggle-label">${expanded ? 'Ocultar itens ▴' : 'Ver itens ▾'}</span>
              </button>
              ${p.observacao ? `<div class="pedido-obs" style="margin-top:6px">📝 ${esc(p.observacao)}</div>` : ''}
              ${p.desconto_aplicado > 0 ? `<div style="font-size:12px;color:var(--aex-success);margin-top:4px">Desconto aplicado: ${esc(String(p.desconto_aplicado))}%</div>` : ''}
            </div>
            <button class="btn btn-secondary btn-repetir-order" onclick="repetirPedido(${p.id})">↺ Repetir pedido</button>
          </div>
        </div>`;
    }

    function toggleItens(uid) {
      const el    = document.getElementById(uid + '-itens');
      const label = document.getElementById(uid + '-toggle-label');
      el.hidden   = !el.hidden;
      label.textContent = el.hidden ? 'Ver itens ▾' : 'Ocultar itens ▴';
    }

    function setStatusFilter(status) {
      activeStatus = status;
      document.querySelectorAll('.status-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.status === status)
      );
      renderList();
    }

    function renderList() {
      const filtrado = activeStatus === 'todos'
        ? allPedidos
        : allPedidos.filter(p => p.status === activeStatus);

      const list      = document.getElementById('pedidos-list');
      const emptyFilt = document.getElementById('empty-filter');
      if (!filtrado.length) {
        list.innerHTML = '';
        emptyFilt.hidden = false;
      } else {
        emptyFilt.hidden = true;
        list.innerHTML = filtrado.map((p, i) => renderPedido(p, i)).join('');
      }
    }

    function renderSummary(pedidos) {
      const total    = pedidos.length;
      const unidades = pedidos.reduce((s, p) => s + parseItens(p.itens).reduce((ss, i) => ss + (i.quantidade || 1), 0), 0);
      const valor    = pedidos.reduce((s, p) => s + parseItens(p.itens).reduce((ss, i) => ss + ((i.preco_unitario || 0) * (i.quantidade || 1)), 0), 0);
      document.getElementById('s-total').textContent    = total;
      document.getElementById('s-unidades').textContent = unidades;
      document.getElementById('s-valor').textContent    = valor > 0 ? fmtBRL(valor) : '—';
    }

    async function loadPedidos() {
      try {
        const r = await fetch('/api/orders');
        if (r.status === 401) { location.href = '/login?next=/meus-pedidos'; return; }
        const pedidos = await r.json();
        document.getElementById('loading').hidden = true;

        if (!pedidos.length) {
          document.getElementById('empty-all').hidden = false;
          return;
        }
        allPedidos = pedidos;
        renderSummary(pedidos);
        document.getElementById('content').hidden = false;
        renderList();
      } catch {
        document.getElementById('loading').textContent = 'Erro ao carregar pedidos.';
      }
    }

    fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(d => {
      if (!d || d.tipo !== 'cliente') { location.href = '/login?next=/meus-pedidos'; return; }
      document.getElementById('user-name').textContent = d.razao_social || d.nome;
      loadPedidos();
      setInterval(loadPedidos, 60000);
    });
  </script>
</body>
</html>
