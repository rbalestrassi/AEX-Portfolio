<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — AEX Air Automotive</title>
  <script>(function(){var t=localStorage.getItem('aex-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 380px; padding: 16px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo img { height: 48px; }
    .theme-corner { position:fixed; top:16px; right:16px; }
  </style>
</head>
<body>
  <button class="theme-toggle theme-corner" onclick="toggleTheme()" title="Alternar tema"></button>
  <div class="login-box">
    <div class="login-logo">
      <img src="/assets/aex-logo.png" alt="AEX Air Automotive" onerror="this.style.display='none'">
      <p style="font-size:20px;font-weight:700;margin-top:8px">Acesso Administrativo</p>
      <p class="text-muted" style="margin-top:4px;font-size:13px">AEX Air Automotive</p>
    </div>

    <div class="card">
      <form id="form-admin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="admin-email" placeholder="admin@aex.com.br" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="admin-senha" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="btn-admin">Entrar</button>
      </form>
    </div>
  </div>

  <div id="aex-toast"></div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('aex-theme', next);
    }

    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 3500);
    }

    document.getElementById('form-admin').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-admin');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('admin-email').value,
            senha: document.getElementById('admin-senha').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error, true); btn.disabled = false; btn.textContent = 'Entrar'; return; }
        location.href = '/admin';
      } catch { toast('Erro de conexão.', true); btn.disabled = false; btn.textContent = 'Entrar'; }
    });

    // Redirecionar se já logado como admin
    fetch('/api/auth/me').then(r => r.ok && r.json()).then(d => {
      if (d?.tipo === 'admin') location.href = '/admin';
    });
  </script>
</body>
</html>
