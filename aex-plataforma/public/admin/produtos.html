<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos — Admin AEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/aex-styles.css">
  <style>
    .search-bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .search-bar input { flex:1; min-width:200px; }
    .prod-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--aex-border); }
    .prod-row:last-child { border-bottom:none; }
    .prod-info { flex:1; min-width:0; }
    .prod-info strong { display:block; font-size:14px; }
    .prod-info span { font-size:12px; color:var(--aex-muted); display:block; }
    .prod-code { font-size:12px; color:var(--aex-muted); white-space:nowrap; }
    .prod-preco { text-align:right; white-space:nowrap; }
    .prod-preco .val { font-weight:700; font-size:14px; color:var(--aex-success); }
    .prod-preco .ipi { font-size:11px; color:var(--aex-muted); }
    .sync-info { font-size:12px; color:var(--aex-muted); margin-top:4px; }
    #btn-sync { min-width:160px; }
    #btn-sync:disabled { opacity:.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <nav class="aex-nav">
    <img src="/assets/aex-logo.png" class="logo" alt="AEX" onerror="this.style.display='none'">
    <div class="aex-nav-links">
      <a href="/admin">Dashboard</a>
      <a href="/admin/pedidos">Pedidos</a>
      <a href="/admin/clientes">Clientes <span id="nav-pend" hidden style="background:var(--aex-red);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:middle"></span></a>
      <a href="/admin/produtos" class="active">Produtos</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
  </nav>

  <div class="container">
    <div class="flex items-center justify-between mb-6" style="flex-wrap:wrap;gap:12px">
      <h1 class="page-title" style="margin:0">Produtos <span id="count" class="text-muted" style="font-size:14px;font-weight:400"></span></h1>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <button class="btn btn-primary btn-sm" id="btn-sync" onclick="syncPlanilha()">🔄 Sincronizar Planilha</button>
        <span class="sync-info" id="sync-info">Importa preços e produtos do Google Sheets</span>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="busca" placeholder="Buscar por código, nome ou veículo..." oninput="filtrar()">
    </div>

    <div class="card">
      <div id="loading" style="text-align:center;padding:40px;color:var(--aex-muted)">Carregando...</div>
      <div id="list" hidden></div>
    </div>
  </div>

  <div id="aex-toast"></div>

  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );

    let produtos = [];

    function toast(msg, err) {
      const el = document.getElementById('aex-toast');
      el.textContent = msg;
      el.className = 'show' + (err ? ' error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 4000);
    }
    async function logout() { await fetch('/api/auth/logout',{method:'POST'}); location.href='/login'; }

    function fmtPreco(v) {
      if (!v) return '—';
      return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function filtrar() {
      const q = document.getElementById('busca').value.toLowerCase();
      const vis = q
        ? produtos.filter(p =>
            (p.codigo || '').toLowerCase().includes(q) ||
            (p.nome || '').toLowerCase().includes(q) ||
            (p.veiculos || '').toLowerCase().includes(q)
          )
        : produtos;
      render(vis);
    }

    function render(lista) {
      document.getElementById('count').textContent = `(${lista.length})`;
      if (!lista.length) {
        document.getElementById('list').innerHTML = '<p style="color:var(--aex-muted);padding:16px">Nenhum produto.</p>';
        return;
      }
      document.getElementById('list').innerHTML = lista.map(p => {
        const imagens = (() => { try { return typeof p.imagens === 'string' ? JSON.parse(p.imagens) : (p.imagens || []); } catch { return []; } })();
        const img = imagens[0] || (p.imagem || '');
        return `
          <div class="prod-row">
            ${img ? `<img src="${esc(img)}" alt="${esc(p.codigo)}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;background:#222;flex-shrink:0" onerror="this.style.display='none'">` : ''}
            <div class="prod-info">
              <strong>${esc(p.nome)}</strong>
              <span>${esc(p.linha || '')}${p.modelo_compressor ? ' · ' + esc(p.modelo_compressor) : ''}${p.tensao ? ' · ' + esc(p.tensao) : ''}</span>
              <span style="font-size:11px;color:var(--aex-muted)">Cód. Fab. ${esc(p.codigo)}</span>
              <span>${esc(p.veiculos || '')}</span>
            </div>
            <div class="prod-preco">
              <div class="val">${fmtPreco(p.preco)}</div>
              ${p.ipi ? `<div class="ipi">+IPI ${parseFloat(p.ipi).toFixed(2).replace('.',',')}%</div>` : ''}
            </div>
            <div class="prod-code" style="text-align:right">
              ${p.part_number ? `<span style="display:block;font-weight:700;font-size:13px">${esc(p.part_number)}</span>` : ''}
              <span style="display:block;font-size:11px;color:var(--aex-muted)">${esc(p.codigo)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function syncPlanilha() {
      const btn = document.getElementById('btn-sync');
      btn.disabled = true;
      btn.textContent = '⏳ Sincronizando...';
      document.getElementById('sync-info').textContent = 'Buscando dados da planilha...';
      try {
        const r = await fetch('/api/admin/sync-produtos', { method: 'POST' });
        const d = await r.json();
        if (!r.ok) { toast(d.error || 'Erro ao sincronizar.', true); return; }
        toast(`✅ ${d.total} produtos sincronizados!`);
        document.getElementById('sync-info').textContent = `Última sincronização: ${new Date().toLocaleString('pt-BR')} · ${d.total} produtos`;
        await loadProdutos();
      } catch { toast('Erro de conexão.', true); }
      finally { btn.disabled = false; btn.textContent = '🔄 Sincronizar Planilha'; }
    }

    async function loadProdutos() {
      const r = await fetch('/api/products');
      produtos = await r.json();
      document.getElementById('loading').hidden = true;
      document.getElementById('list').hidden = false;
      filtrar();
    }

    fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(d => {
      if (!d || d.tipo !== 'admin') { location.href = '/login'; return; }
      loadProdutos().catch(() => {
        document.getElementById('loading').textContent = 'Erro ao carregar produtos.';
      });
    });

    fetch('/api/admin/dashboard').then(r => r.json()).then(d => {
      if (d.cadastros_pendentes > 0) {
        const nb = document.getElementById('nav-pend');
        nb.textContent = d.cadastros_pendentes; nb.hidden = false;
      }
    }).catch(() => {});
  </script>
</body>
</html>
